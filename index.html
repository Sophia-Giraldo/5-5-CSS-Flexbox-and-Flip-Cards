<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 4 - Flexbox</title>
    <style>
      body {
  font-family: Arial, Helvetica, sans-serif;
  background-color:#3d311f
}

  h1{
    color:rgb(188, 223, 181)
  }

.flip-card {
  background-color: transparent;
  width: 300px;
  height: 300px;
  perspective: 1000px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
}

.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.flip-card-front {
  background-color: #bbb;
  color: black;
}

.flip-card-back {
  background-color: #503610;
  color: rgb(39, 197, 86);
  transform: rotateY(180deg);
  flex-wrap:wrap;
}

.main{
  /* background-color:#70552b; */
  display:flex;
  justify-content:space-around;
}
    </style>
  </head>
  <body>
    <h1>Jungle Animals</h1>

  <div class="main">
    <div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://www.rainforest-alliance.org/wp-content/uploads/2021/07/Brown-Throated-Three-Toed-Sloth-fullsize.jpg.webp" alt="sloth in tree looking adorable" style="width:300px;height:300px;">
    </div>
    <div class="flip-card-back">

  </div>
</div>
